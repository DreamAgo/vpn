plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

// Cargo workspace is the version source for all clients and the server.
def manifest = rootProject.file('../../Cargo.toml').getText('UTF-8')
def packageSection = (manifest =~ /(?ms)^\[workspace\.package\]\s*\n(.*?)(?=^\[|\z)/)
if (!packageSection.find()) throw new GradleException('Missing Cargo workspace.package')
def versionMatch = (packageSection.group(1) =~ /(?m)^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"\s*$/)
if (!versionMatch.find()) throw new GradleException('Expected a stable major.minor.patch workspace version')
def projectVersion = "${versionMatch.group(1)}.${versionMatch.group(2)}.${versionMatch.group(3)}"
def (major, minor, patch) = (1..3).collect { versionMatch.group(it).toBigInteger() }
def androidVersionCode = major * 1000000 + minor * 1000 + patch
if (minor >= 1000 || patch >= 1000 || androidVersionCode < 1 || androidVersionCode > 2100000000) {
    throw new GradleException('Workspace version exceeds Android versionCode range')
}
android {
    buildFeatures { buildConfig true }
    namespace 'com.biubiu.vpn'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.biubiu.vpn'
        minSdk 26
        targetSdk 35
        versionCode androidVersionCode.intValue()
        versionName projectVersion
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
tasks.register('buildRust', Exec) {
    workingDir rootProject.projectDir.parentFile.parentFile
    commandLine 'bash', 'mobile/scripts/build-native.sh'
}
tasks.named('preBuild').configure { dependsOn 'buildRust' }
