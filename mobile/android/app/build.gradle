plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.biubiu.vpn'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.biubiu.vpn'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.15'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
tasks.register('buildRust', Exec) {
    workingDir rootProject.projectDir.parentFile.parentFile
    commandLine 'bash', 'mobile/scripts/build-native.sh'
}
tasks.named('preBuild').configure { dependsOn 'buildRust' }
