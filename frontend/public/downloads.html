const rules=[

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e;}
function assetFor(downloads,rule){for(const d of downloads){if(!d||typeof d.name!=='string'||typeof d.url!=='string'||!rule.re.test(d.name))continue;try{const u=new URL(d.url,location.href);if(u.origin===location.origin&&u.pathname.startsWith('/updates/releases/')&&!u.username&&!u.password)return {...d,url:u.href};}catch{}}return null;}
function platformCard(title,iconMarkup,downloads){

 const variants=el('div','variants'+(title==='macOS'?' mac-variants':''));

  else variant.append(el('p','unavailable','暂未提供'));
  variants.append(variant);
 }
 card.append(variants);return card;
}

 try{const r=await fetch('/updates/latest.json',{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error();const m=await r.json();if(typeof m.version!=='string'||!Array.isArray(m.downloads)||!rules.some(rule=>assetFor(m.downloads,rule)))throw Error();

 }catch{version.textContent='版本信息暂不可用';const error=el('div','status error','暂时无法加载下载列表，请稍后重试。');const retry=el('button','retry','重新加载');retry.type='button';retry.addEventListener('click',load);error.append(retry);list.replaceChildren(error);}finally{list.setAttribute('aria-busy','false');}
}
