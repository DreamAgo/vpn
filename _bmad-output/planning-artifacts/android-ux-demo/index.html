<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f8f7"><title>易链 · 手机端交互 Demo</title><link rel="stylesheet" href="style.css"></head>
<body><aside class="studio"><div class="eyebrow">YILIAN / MOBILE EXPERIENCE</div><h1>连接工作，<br>也连接安心。</h1><p class="intro">易链手机端交互原型<br>让连接更简单，让状态更清楚。</p><div class="design-note"><span>01</span><div><b>连接，始终是主角</b><p>一个明确的主操作，随时知道连接到了哪里。</p></div></div><div class="design-note"><span>02</span><div><b>出错，也有下一步</b><p>从错误码变成可理解的原因与恢复动作。</p></div></div><div class="design-note"><span>03</span><div><b>信息按需展开</b><p>日常轻一点，连接详情和诊断随时可达。</p></div></div><div class="prototype-controls"><label for="scenario">体验场景</label><select id="scenario"><option value="normal">日常连接</option><option value="login">首次登录</option><option value="quota">6001 · 终端数量已满</option><option value="reconnect">网络切换与重连</option><option value="update">发现新版本</option></select><button class="reset text-btn">重置 Demo ↗</button></div><small>可点击原型 · 所有连接、账号与下载均为模拟<br>不访问 VPN 服务，不保存输入的账号或密码。</small></aside>
<div class="device"><div class="mobile-demo"><span>交互 Demo · 模拟数据</span><button id="mobile-scenarios">切换场景 ⌄</button></div><div class="app"><header id="header"></header><main id="main"></main><nav id="nav" aria-label="主导航"></nav></div></div><div id="overlay" hidden></div><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
