[package]
name = "vpn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
vpn-api-types = { workspace = true }
vpn-core = { workspace = true }
vpn-platform = { workspace = true }
vpn-wireguard = { workspace = true }
vpn-obfs = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs"] }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
zeroize = { workspace = true }
ipnet = { workspace = true }
futures = { workspace = true }
smoltcp = { version = "=0.12.0", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "socket-tcp"] }

# CLI 解析与交互（本 crate 私有依赖）
clap = { version = "4", features = ["derive"] }
rpassword = "7"
rand = { workspace = true }
boringtun = "0.7"
tun = { version = "0.8", features = ["async"] }
net-route = "0.4"
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
