name: Release

# 推送 v* tag 触发：构建 CLI/GUI 客户端、Linux 服务端和 Docker 镜像，发布到 GitHub Releases。
# 也支持 workflow_dispatch 手动触发（只构建+上传产物工件，不创建 Release），便于不打 tag 先验证。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # 创建 Release / 上传产物
  packages: write   # 推送容器镜像到 GHCR

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  validate-source:
    name: Validate unified main release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 packaging/test_release_source.py
      - run: git fetch origin main
      - run: python3 packaging/check-release-source.py
      - name: Reject changes to an existing release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/release-check.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          test "$status" = 404 || { echo "Release exists or could not be checked (HTTP $status). Publish a new version from main."; exit 1; }

  build-android:
    needs: validate-source
    name: Android signed APK and AAB
    uses: ./.github/workflows/mobile.yml
    with:
      release: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets: inherit

  # ============================================================
  # CLI 客户端：Windows exe、macOS amd64/arm、Linux amd64/arm
  # ============================================================
  build-cli:
    needs: validate-source
    name: CLI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: vpn-cli-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: vpn-cli-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: vpn-cli-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: vpn-cli-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: vpn-cli-windows-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # aws-lc-rs 在 Windows/MSVC 需要 NASM 汇编器。
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      # 交叉目标（如 arm mac runner 上编 x86_64-apple-darwin）需显式装 target std，
      # 否则报 error[E0463]: can't find crate for `core`。
      - name: Ensure target std installed
        run: rustup target add ${{ matrix.target }}

      # vpn-cli 的 keyring 在 Linux 经 libdbus-sys 链接系统 libdbus。
      - name: Install libdbus + pkg-config (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache Cargo deps
        uses: Swatinem/rust-cache@v2

      - name: Build vpn-cli
        run: cargo build --release -p vpn-cli --target ${{ matrix.target }}

      - name: Package CLI (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/${{ matrix.artifact }}.tar.gz vpn-cli

      - name: Package CLI (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item target/${{ matrix.target }}/release/vpn-cli.exe dist/${{ matrix.artifact }}.exe
          Compress-Archive -Path dist/${{ matrix.artifact }}.exe -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  # ============================================================
  # Linux 服务端：只发布 Linux amd64/arm
  # ============================================================
  build-linux-server:
    needs: validate-source
    name: Server ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: vpn-server-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: vpn-server-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure target std installed
        run: rustup target add ${{ matrix.target }}

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache Cargo deps
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 前端构建产物由 rust-embed 内嵌进 vpn-server。
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build vpn-server
        run: cargo build --release -p vpn-server --target ${{ matrix.target }}

      - name: Package server
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/${{ matrix.artifact }}.tar.gz vpn-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  # ============================================================
  # Windows CLI 安装器（Inno Setup）：vpn-cli.exe + wintun.dll + PATH/服务注册
  # ============================================================
  windows-cli-installer:
    needs: validate-source
    name: Windows CLI installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo deps
        uses: Swatinem/rust-cache@v2

      # aws-lc-rs 在 Windows/MSVC 需要 NASM 汇编器。
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      # WireGuard 官方 wintun.dll，随包分发（tun crate 运行时加载）。
      - name: Fetch wintun.dll
        shell: pwsh
        run: |
          $v = "0.14.1"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-$v.zip" -OutFile "$env:TEMP\wintun.zip"
          Expand-Archive -Path "$env:TEMP\wintun.zip" -DestinationPath "$env:TEMP\wintun" -Force
          Copy-Item "$env:TEMP\wintun\wintun\bin\amd64\wintun.dll" "packaging\windows\wintun.dll" -Force

      - name: Build vpn-cli.exe
        run: cargo build --release --bin vpn-cli

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(.+)$') { $ver = $Matches[1] } else { $ver = "0.1.0" }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build installer (ISCC)
        shell: pwsh
        run: pwsh packaging/windows/build-installer.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-cli-windows-installer
          path: dist/vpn-cli-setup-*.exe

  # ============================================================
  # Windows 桌面 GUI 客户端（Tauri 2）：MSI + NSIS 安装器（内置 wintun.dll + UAC 自提权）
  # ============================================================
  windows-desktop:
    needs: validate-source
    name: Windows desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo deps (desktop standalone workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Fetch wintun.dll (bundled by tauri.windows.conf.json)
        shell: pwsh
        run: pwsh desktop/scripts/fetch-wintun.ps1

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Tauri build (MSI + NSIS)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          } else {
            npx tauri build
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-desktop-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.sig
            desktop/src-tauri/target/release/bundle/nsis/*.sig

  # ============================================================
  # macOS 桌面 GUI 客户端（Tauri 2）：DMG amd64 + arm64
  # ============================================================
  macos-desktop:
    needs: validate-source
    name: macOS desktop app ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure target std installed
        run: rustup target add ${{ matrix.target }}

      - name: Cache Cargo deps (desktop standalone workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Tauri build (app + DMG)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --target ${{ matrix.target }} --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx tauri build --target ${{ matrix.target }} --bundles app,dmg
          fi

      - name: Verify macOS privileged helper entrypoint
        shell: bash
        run: |
          # Verify the exact release executable copied into the app and DMG bundles.
          binary='desktop/src-tauri/target/${{ matrix.target }}/release/vpn-desktop'
          test -x "$binary"
          build_hash=$(shasum -a 256 "$binary" | awk '{print $1}')
          test ${#build_hash} -eq 64
          reported_hash=$($binary --print-build-hash)
          test "$reported_hash" = "$build_hash"
          set +e
          output=$($binary --privileged-helper 2>&1)
          status=$?
          set -e
          test $status -ne 0
          test "$output" = "vpn-desktop helper: 特权 helper 必须由 root 运行"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-desktop-macos-${{ matrix.arch }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

  # ============================================================
  # Linux 桌面 GUI 客户端（Tauri 2）：AppImage + deb amd64/arm64
  # ============================================================
  linux-desktop:
    needs: validate-source
    name: Linux desktop app ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure target std installed
        run: rustup target add ${{ matrix.target }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libssl-dev \
            libdbus-1-dev \
            pkg-config

      - name: Cache Cargo deps (desktop standalone workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Tauri build (AppImage + deb)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --target ${{ matrix.target }} --bundles appimage,deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx tauri build --target ${{ matrix.target }} --bundles appimage,deb
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-desktop-linux-${{ matrix.arch }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.sig
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.sig

  # ============================================================
  # 汇总产物并创建 GitHub Release（仅 tag 触发；手动 dispatch 只留工件）
  # ============================================================
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-android
      - build-cli
      - build-linux-server
      - windows-cli-installer
      - windows-desktop
      - macos-desktop
      - linux-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vpn-*
          path: artifacts

      - name: Normalize release asset names
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          out="release-assets"
          mkdir -p "$out"

          copy_one() {
            local source_glob="$1"
            local dest_name="$2"
            local matches=()
            shopt -s nullglob
            matches=($source_glob)
            shopt -u nullglob
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected one match for ${source_glob}, found ${#matches[@]}" >&2
              printf '  %s\n' "${matches[@]}" >&2
              exit 1
            fi

            cp "${matches[0]}" "$out/$dest_name"
            if [ -f "${matches[0]}.sig" ]; then
              cp "${matches[0]}.sig" "$out/$dest_name.sig"
            fi
          }

          copy_one "artifacts/vpn-cli-linux-amd64/vpn-cli-linux-amd64.tar.gz" "vpn-cli-linux-amd64-${tag}.tar.gz"
          copy_one "artifacts/vpn-cli-linux-arm64/vpn-cli-linux-arm64.tar.gz" "vpn-cli-linux-arm64-${tag}.tar.gz"
          copy_one "artifacts/vpn-cli-macos-amd64/vpn-cli-macos-amd64.tar.gz" "vpn-cli-macos-amd64-${tag}.tar.gz"
          copy_one "artifacts/vpn-cli-macos-arm64/vpn-cli-macos-arm64.tar.gz" "vpn-cli-macos-arm64-${tag}.tar.gz"
          copy_one "artifacts/vpn-cli-windows-amd64/vpn-cli-windows-amd64.exe" "vpn-cli-windows-amd64-${tag}.exe"
          copy_one "artifacts/vpn-cli-windows-amd64/vpn-cli-windows-amd64.zip" "vpn-cli-windows-amd64-${tag}.zip"
          copy_one "artifacts/vpn-cli-windows-installer/vpn-cli-setup-*.exe" "vpn-cli-windows-amd64-setup-${tag}.exe"

          copy_one "artifacts/vpn-desktop-windows/msi/*.msi" "vpn-gui-windows-amd64-${tag}.msi"
          copy_one "artifacts/vpn-desktop-windows/nsis/*.exe" "vpn-gui-windows-amd64-setup-${tag}.exe"
          copy_one "artifacts/vpn-desktop-macos-amd64/dmg/*.dmg" "vpn-gui-macos-amd64-${tag}.dmg"
          copy_one "artifacts/vpn-desktop-macos-arm64/dmg/*.dmg" "vpn-gui-macos-arm64-${tag}.dmg"
          copy_one "artifacts/vpn-desktop-macos-amd64/macos/*.app.tar.gz" "vpn-gui-macos-amd64-${tag}.app.tar.gz"
          copy_one "artifacts/vpn-desktop-macos-arm64/macos/*.app.tar.gz" "vpn-gui-macos-arm64-${tag}.app.tar.gz"
          copy_one "artifacts/vpn-desktop-linux-amd64/appimage/*.AppImage" "vpn-gui-linux-amd64-${tag}.AppImage"
          copy_one "artifacts/vpn-desktop-linux-amd64/deb/*.deb" "vpn-gui-linux-amd64-${tag}.deb"
          copy_one "artifacts/vpn-desktop-linux-arm64/appimage/*.AppImage" "vpn-gui-linux-arm64-${tag}.AppImage"
          copy_one "artifacts/vpn-desktop-linux-arm64/deb/*.deb" "vpn-gui-linux-arm64-${tag}.deb"

          copy_one "artifacts/vpn-server-linux-amd64/vpn-server-linux-amd64.tar.gz" "vpn-server-linux-amd64-${tag}.tar.gz"
          copy_one "artifacts/vpn-server-linux-arm64/vpn-server-linux-arm64.tar.gz" "vpn-server-linux-arm64-${tag}.tar.gz"

          version="${tag#v}"
          copy_one "artifacts/vpn-android/vpn-android-universal-${version}.apk" "vpn-android-universal-${version}.apk"
          copy_one "artifacts/vpn-android/vpn-android-universal-${version}.aab" "vpn-android-universal-${version}.aab"

          find "$out" -type f | sort

      - name: Generate Tauri updater manifest
        shell: bash
        run: |
          python3 desktop/scripts/generate-updater-manifest.py \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --assets-dir release-assets

      - name: Record common build source
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          folder = Path('release-assets')
          (folder / 'release-provenance.json').write_text(json.dumps({
              'tag': os.environ['GITHUB_REF_NAME'],
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(folder.iterdir()) if p.is_file()},
          }, indent=2) + '\n')
          PYCODE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
          fail_on_unmatched_files: false

  # ============================================================
  # Docker 镜像（服务端）推送到 GHCR
  # ============================================================
  docker:
    needs: release
    name: Docker image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
